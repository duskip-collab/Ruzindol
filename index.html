<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Moji Susedia - Komunita</title>

    <!-- PWA a Manifest pre Android / Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#18181b" />

    <!-- PWA nastavenia pre iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moji Susedia" />
    <!-- Ak máš ikony pomenované inak, zmeň href -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
      <script>
        (function () {
          var key = "komunita.ui.fontScale.v1";
          var sizes = { "1": 16, "2": 18, "3": 20 };
          try {
            var raw = window.localStorage.getItem(key);
            var size = sizes[raw || "1"] || 16;
            document.documentElement.style.fontSize = size + "px";
          } catch (e) {
            document.documentElement.style.fontSize = "16px";
          }
        })();
      </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
